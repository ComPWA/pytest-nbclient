[project]
name = "pytest-nbclient"
version = "0.1.0"
description = "Execute Jupyter notebooks as pytest items with nbclient"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "ipykernel",
    "nbclient",
    "nbformat",
    "pytest",
    "pyzmq",
    "traitlets",
]

[project.entry-points.pytest11]
nbclient = "pytest_nbclient"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    { include-group = "style" },
]
style = ["ty"]
test = ["pytest"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.compwa.policy]
package-manager = "uv"
pytest-single-threaded = true
repo-name = "pytest-nbclient"

[tool.compwa.policy.python]
type-checker = ["ty"]

[tool.compwa.policy.github]
no-cd = true
no-pypi = true

[tool.poe.tasks.style]
cmd = "prek run --all-files"
executor = { type = "simple" }
help = "Run all style checks"

[tool.poe.tasks.upgrade]
executor = { type = "simple" }
help = "Upgrade lock files"
parallel = ["_upgrade-precommit", "_upgrade-uv"]

[tool.poe.tasks._upgrade-uv]
cmd = "uv lock --upgrade"
executor = { type = "simple" }

[tool.poe.tasks._upgrade-precommit]
cmd = "prek autoupdate"
executor = { type = "simple" }

[tool.poe.executor]
isolated = true
no-group = "dev"
type = "uv"

[tool.poe.groups.test]
heading = "Testing"

[tool.poe.groups.test.tasks.test]
cmd = "pytest ${paths}"
executor = { group = "test" }
help = "Run the test suite"

[[tool.poe.groups.test.tasks.test.args]]
name = "paths"
positional = true
multiple = true
default = "src tests"

[tool.poe.groups.test.tasks.test-all]
help = "Run all tests on each supported Python version"
sequence = [
    "test-py310 ${paths}",
    "test-py311 ${paths}",
    "test-py312 ${paths}",
    "test-py313 ${paths}",
    "test-py314 ${paths}",
    "test-py315 ${paths}",
]

[[tool.poe.groups.test.tasks.test-all.args]]
default = ""
multiple = true
name = "paths"
positional = true

[tool.poe.groups.test.tasks.test-py310]
env = { UV_PYTHON = "3.10" }
ref = "test"

[tool.poe.groups.test.tasks.test-py311]
env = { UV_PYTHON = "3.11" }
ref = "test"

[tool.poe.groups.test.tasks.test-py312]
env = { UV_PYTHON = "3.12" }
ref = "test"

[tool.poe.groups.test.tasks.test-py313]
env = { UV_PYTHON = "3.13" }
ref = "test"

[tool.poe.groups.test.tasks.test-py314]
env = { UV_PYTHON = "3.14" }
ref = "test"

[tool.poe.groups.test.tasks.test-py315]
env = { UV_PYTHON = "3.15" }
ref = "test"

[tool.pytest]
addopts = [
    "--color=yes",
    "--import-mode=importlib",
    "-p",
    "pytester",
]
minversion = "9.0"
testpaths = ["tests"]

[tool.ruff]
preview = true
show-fixes = true
src = [
    "src",
    "tests",
]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "DOC",
    "PTH",
    "any-type",
    "if-else-block-instead-of-if-exp",
    "incorrect-blank-line-before-class",
    "line-too-long",
    "logging-f-string",
    "missing-copyright-notice",
    "missing-dashed-underline-after-section",
    "missing-section-name-colon",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "non-empty-init-module",
    "pytest-fixture-incorrect-parentheses-style",
    "read-whole-file",
    "reimplemented-starmap",
    "single-line-implicit-string-concatenation",
    "undocumented-magic-method",
    "undocumented-public-class",
    "undocumented-public-function",
    "undocumented-public-init",
    "undocumented-public-method",
    "unspecified-encoding",
    "write-whole-file",
]
task-tags = ["cspell"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",
    "D",
    "T20",
    "assert",
    "boolean-type-hint-positional-argument",
    "float-equality-comparison",
    "implicit-namespace-package",
    "import-private-name",
    "magic-value-comparison",
    "no-self-use",
    "private-member-access",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tombi.files]
exclude = ["**/uv.lock"]

[tool.tombi.format.rules]
indent-width = 4
line-width = 88

[tool.tombi.lint.rules]
key-empty = "off"

[[tool.tombi.schemas]]
root = "tool.compwa.policy"
path = "https://raw.githubusercontent.com/ComPWA/policy/0.10.2/compwa-policy.schema.json"
include = ["pyproject.toml"]

[tool.ty.rules]
division-by-zero = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"

[tool.ty.terminal]
error-on-warning = true
